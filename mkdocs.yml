# ARQUIVO GERADO AUTOMATICAMENTE POR `loa build`.
# Não edite aqui: mexa em config/site.yml e config/demonstrativos.yml.
site_name: Orçamento de Minas Gerais — LOA 2026
site_description: Lei Orçamentária Anual do Estado de Minas Gerais, exercício 2026.
  Todos os demonstrativos do projeto de lei enviado à Assembleia Legislativa, navegáveis,
  pesquisáveis e com os dados abertos.
site_author: SEPLAG-MG / Subsecretaria de Planejamento e Orçamento
copyright: 'Governo do Estado de Minas Gerais — dados públicos, uso livre. Elaboração:
  SCPO/SEPLAG.'
site_url: https://LorenadeCastro.github.io/loa-mg/
repo_url: https://github.com/LorenadeCastro/loa-mg
repo_name: LorenadeCastro/loa-mg
edit_uri: ''
theme:
  name: material
  language: pt-BR
  font:
    text: Inter
    code: JetBrains Mono
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Modo escuro
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Modo claro
  logo: assets/bandeira.svg
  favicon: assets/bandeira.svg
  icon:
    repo: fontawesome/brands/github
  features:
  - navigation.instant
  - navigation.tracking
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - navigation.prune
  - toc.follow
  - search.suggest
  - search.highlight
  - search.share
  - content.tooltips
  - content.action.view
plugins:
- search:
    lang: pt
markdown_extensions:
- abbr
- admonition
- attr_list
- def_list
- footnotes
- md_in_html
- tables
- toc:
    permalink: ¶
    permalink_title: Link permanente para esta seção
- pymdownx.details
- pymdownx.superfences
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- pymdownx.tabbed:
    alternate_style: true
extra_css:
- assets/loa.css
extra_javascript:
- assets/loa.js
extra:
  generator: false
  social:
  - icon: material/web
    link: https://www.mg.gov.br
    name: Portal do Governo de Minas Gerais
