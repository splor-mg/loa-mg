# Glossário do orçamento.
#
# Cada termo cadastrado aqui vira automaticamente um balãozinho de ajuda
# em TODAS as tabelas do site, no lugar onde a palavra aparece — e também
# alimenta a página "Glossário".
#
# Formato:  TERMO: explicação em linguagem de gente.
#
# Escreva o termo exatamente como ele aparece nos dados (maiúsculas
# incluídas). A busca ignora acentos de caixa, mas não de grafia.

ICMS: >-
  Imposto sobre Circulação de Mercadorias e Serviços. É o maior tributo
  estadual: incide sobre quase tudo que se compra, da energia elétrica ao
  supermercado. Uma parte é obrigatoriamente repassada aos municípios.

IPVA: >-
  Imposto sobre a Propriedade de Veículos Automotores, pago anualmente por
  quem tem carro, moto ou caminhão. Metade fica com o município onde o
  veículo está registrado.

ITCD: >-
  Imposto sobre Transmissão Causa Mortis e Doação: incide sobre heranças e
  doações de bens.

IRRF: >-
  Imposto de Renda Retido na Fonte. O Estado fica com o imposto de renda
  descontado dos salários que ele mesmo paga.

FPE: >-
  Fundo de Participação dos Estados: repasse que a União faz aos estados a
  partir da arrecadação federal do Imposto de Renda e do IPI.

FUNDEB: >-
  Fundo de Manutenção e Desenvolvimento da Educação Básica. Reúne parte dos
  impostos estaduais e municipais e redistribui o dinheiro para a educação
  básica pública.

QESE: >-
  Quota Estadual do Salário-Educação: contribuição das empresas destinada
  ao financiamento da educação básica.

SUS: >-
  Sistema Único de Saúde. As transferências do SUS são repasses federais
  para custeio e investimento em saúde.

CIDE: >-
  Contribuição de Intervenção no Domínio Econômico, cobrada sobre
  combustíveis. Parte é repassada a estados e municípios para uso em
  infraestrutura de transporte.

RECEITA CORRENTE LÍQUIDA: >-
  Soma das receitas correntes menos as transferências obrigatórias e as
  deduções. É a base de cálculo dos limites de gasto com pessoal e
  endividamento previstos na Lei de Responsabilidade Fiscal.

UNIDADE ORÇAMENTÁRIA: >-
  A menor unidade da administração que recebe dotação própria na lei do
  orçamento. Uma secretaria pode ter várias: ela mesma, suas fundações,
  autarquias e fundos.

RESERVA DE CONTINGÊNCIA: >-
  Parcela do orçamento que não tem destino definido no início do ano. Serve
  para imprevistos e para abrir créditos adicionais durante a execução.

INVERSÕES FINANCEIRAS: >-
  Aquisição de imóveis já existentes, de participação em empresas ou
  concessão de empréstimos. Diferente de investimento, não gera bem novo.

INVESTIMENTOS: >-
  Despesas que criam ou ampliam bens públicos: obras, reformas, compra de
  equipamentos e veículos.

PESSOAL E ENCARGOS SOCIAIS: >-
  Salários, aposentadorias e pensões dos servidores, mais os encargos
  patronais pagos pelo Estado.

OUTRAS DESPESAS CORRENTES: >-
  Custeio do dia a dia: material de consumo, contratos de serviços, energia,
  aluguel, medicamentos, merenda escolar, diárias.

AMORTIZAÇÃO DA DÍVIDA: >-
  Pagamento do principal das dívidas do Estado — o abatimento do saldo
  devedor, sem contar os juros.

JUROS E ENCARGOS DA DÍVIDA: >-
  Custo de carregar a dívida pública: juros, taxas e correção, sem abater o
  saldo devedor.

DÍVIDA ATIVA: >-
  Créditos que o Estado tem a receber de contribuintes inadimplentes, já
  formalmente inscritos para cobrança.

ORÇAMENTO FISCAL: >-
  Parte do orçamento que reúne os poderes do Estado, seus fundos, autarquias,
  fundações e as empresas estatais dependentes do Tesouro.

ORÇAMENTO DE INVESTIMENTO: >-
  Orçamento das empresas em que o Estado é sócio majoritário e que se
  sustentam com receita própria. Só entram os investimentos.

RECEITA VINCULADA: >-
  Receita que já nasce com destino definido por lei ou pela Constituição —
  saúde, educação, FUNDEB, repasse a municípios. O gestor não pode
  redirecionar.

RECEITA ORDINÁRIA: >-
  Receita sem destinação obrigatória prévia, que o Estado pode alocar
  livremente conforme as prioridades do orçamento.

FONTE DE RECURSO: >-
  Código que identifica a origem do dinheiro e o que se pode fazer com ele.
  É o que garante que recurso da saúde não pague despesa de outra área.

INTRA-ORÇAMENTÁRIA: >-
  Operação entre órgãos do próprio Estado. Aparece separada para não contar
  o mesmo real duas vezes no total.

DEDUÇÕES DA RECEITA CORRENTE: >-
  Valores que entram no caixa mas saem obrigatoriamente, como a parte do
  ICMS e do IPVA que pertence aos municípios e a parcela destinada ao FUNDEB.

UGEPREVI: >-
  Unidade de Gestão Previdenciária Integrada, responsável pela gestão do
  regime próprio de previdência dos servidores do Estado.

IPSM: >-
  Instituto de Previdência dos Servidores Militares do Estado de Minas Gerais.

REGIÃO GEOGRÁFICA INTERMEDIÁRIA: >-
  Divisão territorial do IBGE que agrupa municípios em torno de um polo
  regional. Minas Gerais tem 13 delas.
