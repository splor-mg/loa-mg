- id: anexo-iii
  titulo: Anexo III — Investimento das estatais
  descricao: Orçamento de Investimento das empresas em que o Estado é sócio majoritário. Elas se sustentam com receita própria,
    por isso só os investimentos entram na lei orçamentária.
  demonstrativos:
  - id: investimento-estatais
    titulo: Investimento por Empresa segundo as Fontes de Financiamento
    base_legal: Art. 165, §5º, inciso II, da Constituição Federal
    resumo: Quanto cada empresa controlada pelo Estado vai investir, e com que dinheiro.
    explicacao: 'Estas empresas — CEMIG, COPASA, BDMG, GASMIG e outras — não dependem

      do Tesouro estadual para se manter: cobram tarifas ou prestam

      serviços. O que a Assembleia autoriza aqui é o **plano de

      investimento** de cada uma: usinas, redes de água e esgoto,

      gasodutos, sistemas.


      As colunas mostram a origem do dinheiro. Repare que **recursos

      próprios** dominam: é a diferença entre uma estatal dependente e

      uma que se sustenta.


      Por isso os valores desta página **não se somam** ao Orçamento

      Fiscal: são orçamentos distintos, com dinheiro de origem diferente.

      '
    dados: investimento_estatais.csv
    ordenar_por: total
    colunas:
    - campo: uo_nome
      titulo: Empresa
      tipo: texto
    - campo: tesouro_ordinario
      titulo: Tesouro ordinário
      tipo: dinheiro
    - campo: tesouro_vinculado
      titulo: Tesouro vinculado
      tipo: dinheiro
    - campo: outras_entidades
      titulo: Outras entidades
      tipo: dinheiro
    - campo: operacao_credito
      titulo: Operação de crédito
      tipo: dinheiro
    - campo: recursos_proprios
      titulo: Recursos próprios
      tipo: dinheiro
    - campo: outras_origens
      titulo: Outras origens
      tipo: dinheiro
    - campo: total
      titulo: Total
      tipo: dinheiro
