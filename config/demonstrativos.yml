- id: anexo-ii-a
  titulo: Anexo II-A — Orçamento Fiscal (receitas)
  descricao: Origem detalhada dos recursos de cada unidade orçamentária. No PDF são 622 páginas do mesmo quadro repetido,
    com a hierarquia da receita "desenrolada" linha a linha. Aqui a hierarquia volta a ser uma árvore que abre e fecha, e
    cada unidade tem sua própria página.
  demonstrativos:
  - id: recursos-financeiros
    titulo: Demonstrativo dos Recursos Financeiros
    base_legal: Art. 2º, §1º, inciso I, da Lei federal nº 4.320/1964
    resumo: De onde vem o dinheiro de cada unidade orçamentária do Estado.
    explicacao: 'O **código** de nove posições é a classificação oficial da receita.

      Ele é hierárquico: os primeiros dígitos dizem a categoria econômica,

      os seguintes vão estreitando até o tipo exato de arrecadação.


      É por isso que a mesma receita aparece várias vezes com valores

      iguais em níveis diferentes: não é repetição, é o mesmo dinheiro

      visto com mais ou menos detalhe. **Somar todas as linhas de uma

      tabela dá um número sem sentido** — some apenas as linhas de um mesmo

      nível.


      A **fonte** é o código que amarra o recurso a uma finalidade. É ela

      que impede, por exemplo, que dinheiro carimbado da saúde pague

      despesa de outra área.


      Comece com a árvore fechada e vá abrindo só o ramo que interessa.

      '
    dados: recursos_financeiros.csv
    agrupar_por: uo_nome
    filtro_resumo:
      nivel: '1'
    hierarquia:
      campo_nivel: nivel
    nivel_aberto: 3
    mostrar_total: false
    colunas:
    - campo: especificacao
      titulo: Especificação
      tipo: texto
    - campo: codigo
      titulo: Código
      tipo: texto
    - campo: fonte
      titulo: Fonte
      tipo: texto
    - campo: valor
      titulo: Valor previsto
      tipo: dinheiro
    colunas_resumo:
    - campo: uo_nome
      titulo: Unidade Orçamentária
      tipo: texto
    - campo: valor
      titulo: Receita prevista
      tipo: dinheiro
    ordenar_resumo: valor
    cards:
    - titulo: Receita das unidades
      campo: valor
      funcao: soma
      filtro:
        nivel: '1'
      nota: somando apenas o nível mais alto
    - titulo: Unidades orçamentárias
      funcao: contagem
      filtro:
        nivel: '1'
    graficos:
    - tipo: barras
      titulo: Unidades com maior receita própria
      rotulo: uo_nome
      valor: valor
      filtro:
        nivel: '1'
      limite: 12
    validacoes:
    - tipo: sem_vazios
      campos:
      - uo_nome
      - codigo
      - valor
      descricao: toda linha tem unidade, código e valor
    - tipo: niveis_fecham
      campo_nivel: nivel
      campo: valor
      descricao: cada nível é igual à soma dos seus filhos
    pdf: T4_DEMONSTRATIVO_DOS_RECURSOS_FINANCEIROS.pdf
    paginas: 1-161
  - id: fonte-grupo-despesa
    titulo: Fonte de Recursos e Grupos de Despesa
    base_legal: Art. 8º, parágrafo único, da Lei Complementar federal nº 101/2000
    resumo: Qual dinheiro paga qual tipo de gasto, em cada unidade.
    explicacao: 'Cada linha cruza uma **fonte de recurso** com os **grupos de

      despesa** que ela financia. É o quadro que mostra, na prática, o que

      significa dinheiro carimbado: uma fonte vinculada à educação não

      aparece pagando despesa de outra área.


      O código da fonte (10, 42, 60…) é o mesmo usado no restante do

      orçamento e na execução.

      '
    dados: fonte_grupo_despesa.csv
    agrupar_por: uo_nome
    filtro_resumo:
      papel: total
