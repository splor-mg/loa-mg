# =====================================================================
#  ESTE É O ÚNICO ARQUIVO QUE VOCÊ PRECISA EDITAR PARA PUBLICAR
#  UM DEMONSTRATIVO NOVO. Não é preciso escrever código Python.
#
#  Estrutura:
#      anexos:
#        - id / titulo / descricao
#          demonstrativos:
#            - id / titulo / dados / colunas / ...
#
#  Dica: rode `poetry run loa new nome_do_arquivo.csv` e ele imprime um
#  bloco já preenchido com as colunas do seu CSV, pronto para colar aqui.
#
#  Tipos de coluna: texto | dinheiro | quantidade | percentual
#  Funções de card: soma | contagem | maximo | valor_de
#  Tipos de gráfico: barras | rosca
# =====================================================================

anexos:

  # -------------------------------------------------------------------
- id: anexo-i
  titulo: Anexo I — Demonstrativos
  descricao: Visão consolidada do Orçamento Fiscal e do Orçamento de Investimento das empresas controladas pelo Estado. É
    aqui que se verifica os grandes números do orçamento de Minas em 2026.
  demonstrativos:
  - id: consolidado-receita
    titulo: Demonstrativo Consolidado do Orçamento Fiscal — Receita
    base_legal: Art. 7º, inciso I, da Lei estadual nº 25.440/2025 (LDO)
    resumo: De onde vem o dinheiro que o Estado espera arrecadar em 2026.
    explicacao: 'A receita aparece dividida em **ordinária** (o Estado decide onde

      aplicar) e **vinculada** (já tem destino definido por lei — saúde,

      educação, FUNDEB, repasse aos municípios).


      As linhas com valor negativo são **deduções**: parcelas que entram

      no caixa mas saem obrigatoriamente, como a parte do ICMS que

      pertence aos municípios. Por isso o total arrecadado é maior que o

      total disponível.


      A **receita intra-orçamentária** é dinheiro que um órgão do Estado

      paga a outro. Aparece separada para que o mesmo real não seja

      contado duas vezes.


      Clique em uma **linha com seta** para abrir o detalhamento.

      '
    dados: consolidado_fiscal.csv
    filtro:
      lado: receita
    hierarquia:
      campo_nivel: nivel
    nivel_aberto: 2
    mostrar_total: false
    colunas:
    - campo: especificacao
      titulo: Origem da receita
      tipo: texto
    - campo: ordinaria
      titulo: Ordinária
      tipo: dinheiro
      percentual_campo: part_ord_rec
    - campo: vinculada
      titulo: Vinculada
      tipo: dinheiro
      percentual_campo: part_vinc_rec
    - campo: total
      titulo: Total
      tipo: dinheiro
      percentual_campo: part_total_rec
    cards:
    - titulo: Receita fiscal total
      campo: total
      funcao: valor_de
      filtro:
        especificacao: TOTAL DA RECEITA FISCAL
    - titulo: ICMS
      campo: total
      funcao: maximo
      filtro:
        especificacao: ICMS
      nota: principal tributo do Estado
    - titulo: Deduções obrigatórias
      campo: total
      funcao: valor_de
      filtro:
        especificacao: DEDUÇÕES DA RECEITA CORRENTE
      nota: municípios, FUNDEB e outros
    validacoes:
    - tipo: sem_vazios
      campos:
      - especificacao
      - total
      descricao: toda linha tem descrição e valor
    pdf: 01. Demonstrativo Consolidado do Or#U00e7amento Fiscal.pdf
    paginas: '1'
  - id: consolidado-despesa
    titulo: Demonstrativo Consolidado do Orçamento Fiscal — Despesa
    base_legal: Art. 7º, inciso I, da Lei estadual nº 25.440/2025 (LDO)
    resumo: Para onde vai o dinheiro do Estado em 2026.
    explicacao: '**Despesas correntes** mantêm a máquina funcionando: salários,

      contas de luz, medicamentos, merenda. **Despesas de capital** são

      investimentos: obras, equipamentos, amortização da dívida.


      A **reserva de contingência** é uma parcela guardada para imprevistos

      e para abrir créditos adicionais ao longo do ano.


      Dentro de cada grupo, o gasto aparece separado entre Executivo e

      demais Poderes, e depois entre administração direta e indireta.

      '
    dados: consolidado_fiscal.csv
    filtro:
      lado: despesa
    hierarquia:
      campo_nivel: nivel
    nivel_aberto: 2
    mostrar_total: false
    colunas:
    - campo: especificacao
      titulo: Natureza da despesa
      tipo: texto
    - campo: ordinaria
      titulo: Ordinária
      tipo: dinheiro
      percentual_campo: part_ord
    - campo: vinculada
      titulo: Vinculada
      tipo: dinheiro
      percentual_campo: part_vinc
    - campo: total
      titulo: Total
      tipo: dinheiro
      percentual_campo: part_total
    cards:
    - titulo: Despesa fiscal total
      campo: total
      funcao: valor_de
      filtro:
        especificacao: TOTAL DA DESPESA FISCAL
    - titulo: Pessoal e encargos
      campo: total
      funcao: valor_de
      filtro:
        especificacao: PESSOAL E ENCARGOS SOCIAIS
    - titulo: Investimentos
      campo: total
      funcao: maximo
      filtro:
        especificacao: INVESTIMENTOS
      nota: obras e equipamentos
    validacoes:
    - tipo: sem_vazios
      campos:
      - especificacao
      - total
      descricao: toda linha tem descrição e valor
    pdf: 01. Demonstrativo Consolidado do Or#U00e7amento Fiscal.pdf
    paginas: '1'
  - id: categorias-economicas
    titulo: Resumo da Receita e da Despesa segundo as Categorias Econômicas
    base_legal: Art. 2º, §1º, inciso II, da Lei federal nº 4.320/1964
    resumo: Quadro receita x despesa.
    explicacao: 'Este é o formato exigido pela Lei federal nº 4.320/1964 para todo

      orçamento público do país -, o que permite comparar Minas com outros

      estados.

      '
    dados: categorias_economicas.csv
    mostrar_total: false
    colunas:
    - campo: especificacao
      titulo: Especificação
      tipo: texto
    - campo: lado
      titulo: Lado
      tipo: texto
    - campo: valor
      titulo: Valor
      tipo: dinheiro
    cards:
    - titulo: Total da receita
      campo: valor
      funcao: valor_de
      filtro:
        lado: receita
        papel: total
    - titulo: Total da despesa
      campo: valor
      funcao: valor_de
      filtro:
        lado: despesa
        papel: total
    - titulo: Déficit previsto
      campo: valor
      funcao: valor_de
      filtro:
        papel: resultado
      nota: diferença entre receita e despesa
    graficos:
    - tipo: barras
      titulo: Despesa por categoria econômica
      rotulo: especificacao
      valor: valor
      filtro:
        lado: despesa
        papel: parcela
    validacoes:
    - tipo: parcelas_somam_total
      campo: valor
      agrupar_por: lado
      descricao: parcelas somam o total declarado, em cada lado
    pdf: T3_DCGF_Demonstrativo_Receita_Despesa_Segundo_Categorias_Economicas.pdf
    paginas: '1'
  - id: despesa-por-unidade
    titulo: Despesa por Unidade Orçamentária segundo os Grupos de Despesa
    base_legal: Art. 2º, §2º, inciso II, da Lei federal nº 4.320/1964
    resumo: Quanto cada órgão do Estado tem para gastar em 2026.
    explicacao: 'Cada linha é uma **unidade orçamentária** -, a menor unidade que

      recebe dotação própria na lei. Uma secretaria pode ter várias, a

      secretaria em si, suas fundações, seus fundos.


      As colunas são os **grupos de natureza da despesa**, a classificação

      oficial do que se pode fazer com o dinheiro.

      '
    dados: despesa_uo_grupo.csv
    ordenar_por: total
    colunas:
    - campo: uo_nome
      titulo: Unidade Orçamentária
      tipo: texto
    - campo: pessoal
      titulo: Pessoal e encargos
      tipo: dinheiro
    - campo: juros
      titulo: Juros da dívida
      tipo: dinheiro
    - campo: outras_correntes
      titulo: Outras despesas correntes
      tipo: dinheiro
    - campo: investimentos
      titulo: Investimentos
      tipo: dinheiro
    - campo: inversoes
      titulo: Inversões financeiras
      tipo: dinheiro
    - campo: amortizacao
      titulo: Amortização da dívida
      tipo: dinheiro
    - campo: reserva
      titulo: Reserva de contingência
      tipo: dinheiro
    - campo: total
      titulo: Total
      tipo: dinheiro
    cards:
    - titulo: Despesa fiscal total
      campo: total
      funcao: soma
    - titulo: Unidades orçamentárias
      funcao: contagem
    - titulo: Maior orçamento individual
      campo: total
      funcao: maximo
    graficos:
    - tipo: barras
      titulo: As 12 unidades orçamentárias com maior dotação
      rotulo: uo_nome
      valor: total
      limite: 12
      nota: O percentual é sobre o total da despesa fiscal do Estado.
    validacoes:
    - tipo: soma_igual
      campo: total
      esperado: 146969637358,00
      descricao: soma das unidades = total da despesa fiscal
    - tipo: colunas_somam
      parcelas:
      - pessoal
      - juros
      - outras_correntes
      - investimentos
      - inversoes
      - amortizacao
      - reserva
      total: total
      descricao: grupos de despesa somam o total em cada linha
    - tipo: sem_vazios
      campos:
      - uo_nome
      - total
      descricao: toda unidade tem nome e total
    pdf: T4_DEMONSTRATIVO_DESPESA_POR_ORGAOS_ENTIDADES_SEGUNDO_GRUPOS_DESPESA.pdf
    paginas: 1-8
  - id: quadro-geral-receita
    titulo: Quadro Geral da Receita
    base_legal: Art. 2º, §1º, inciso I, da Lei federal nº 4.320/1964
    resumo: Receita total do Estado.
    explicacao: 'O **código** de nove posições é a classificação oficial da receita,

      usada em todo o país. Ele é hierárquico: os primeiros dígitos dizem a

      categoria econômica, os seguintes vão estreitando até o tipo exato de

      arrecadação.


      A mesma receita aparece em vários níveis com valores iguais: não é

      repetição, é o mesmo dinheiro visto com mais ou menos detalhe.

      **Somar todas as linhas dá um número sem sentido** -, some apenas as

      linhas de um mesmo nível.

      '
    dados: receita_geral.csv
    hierarquia:
      campo_nivel: nivel
    nivel_aberto: 2
    mostrar_total: false
    colunas:
    - campo: especificacao
      titulo: Especificação
      tipo: texto
    - campo: codigo
      titulo: Código
      tipo: texto
    - campo: fonte
      titulo: Fonte
      tipo: texto
    - campo: valor
      titulo: Valor previsto
      tipo: dinheiro
    cards:
    - titulo: Receita prevista
      campo: valor
      funcao: soma
      filtro:
        nivel: '1'
      nota: somando apenas o nível mais alto
    - titulo: Linhas de classificação
      funcao: contagem
    validacoes:
    - tipo: sem_vazios
      campos:
      - codigo
      - especificacao
      - valor
      descricao: toda linha tem código, descrição e valor
    - tipo: niveis_fecham
      campo_nivel: nivel
      campo: valor
      descricao: cada nível é igual à soma dos seus filhos
    pdf: T7_QUADRO_GERAL_DA_RECEITA.pdf
    paginas: 1-47
  - id: pessoal-consolidado
